global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: faulty-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - faulty-service:8001
  - job_name: incident-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - incident-worker:8002
